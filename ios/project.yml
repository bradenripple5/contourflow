name: ContourFlow

options:
  bundleIdPrefix: com.contourflow
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  ContourFlow:
    type: application
    platform: iOS
    sources:
      - path: ContourFlow/Sources
      - path: ContourFlow/Web
      - path: ContourFlow/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: ContourFlow
        PRODUCT_BUNDLE_IDENTIFIER: com.contourflow.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ContourFlow/Info.plist
      properties:
        CFBundleDisplayName: Contour Flow
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: >-
          Contour Flow draws live contour patterns from the camera. Video is
          processed on this device and never leaves it.
        NSMicrophoneUsageDescription: >-
          Contour Flow uses the microphone so patterns can react to sound.
          Audio is processed on this device and never leaves it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  ContourFlow:
    build:
      targets:
        ContourFlow: all
    run:
      config: Debug
    archive:
      config: Release
